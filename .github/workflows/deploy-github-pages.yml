name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Daily rebuild so new YouTube uploads appear without anyone committing.
  schedule:
    - cron: "41 4 * * *"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Test Worker
        run: npm run test:worker

      - name: Test YouTube feed parser
        run: npm run test:youtube

      # Build-time only (never committed). If YouTube's RSS is down, this warns and
      # the build uses the list already in content/youtube.json.
      - name: Refresh YouTube feed
        run: npm run sync:youtube

      # Instagram is switched off (INSTAGRAM_ENABLED in config/site-structure.mjs): no
      # feed is synced or shown. Its code stays dormant and tested; turning it back on
      # means restoring the sync and cache steps (docs/instagram-setup.md).
      - name: Test Instagram feed sync
        run: npm run test:instagram

      # base_path is "/Tzion-Breslov-Project" on the github.io URL and "" once
      # the custom domain is set in the Pages settings.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}

      - name: Check static export
        run: npm run check:static-export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
