name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Typecheck, lint, Worker tests, build, export check
        run: npm run check

      # Switch-day path: the same export built for tzionbreslov.org must have no
      # tzionbreslov.com left in canonicals, social tags, JSON-LD, sitemaps or robots.
      - name: Build and check the tzionbreslov.org variant
        run: npm run build && npm run check:static-export
        env:
          NEXT_PUBLIC_SITE_URL: https://tzionbreslov.org
