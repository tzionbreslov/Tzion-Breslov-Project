name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck, lint, unit + Worker tests, build, export + wording checks, browser tests
        run: npm run check

      # Switch-day path: the same export built for tzionbreslov.org must have no
      # tzionbreslov.com left in canonicals, social tags, JSON-LD, sitemaps or robots.
      - name: Build and check the tzionbreslov.org variant
        run: npm run build && npm run check:static-export
        env:
          NEXT_PUBLIC_SITE_URL: https://tzionbreslov.org
